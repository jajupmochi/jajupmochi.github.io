<!DOCTYPE html>
<html lang="en" data-site="portfolio">
<head>
<meta charset="UTF-8">
<script>
  /* apps-gallery.html now defaults to the deck (the preferred app view). Many external
     docs link to this URL, so a bare visit lands on the full-screen deck. The deck's
     own "Grid view" link passes ?view=cards, which keeps you on this gallery. */
  (function () {
    if (!new URLSearchParams(location.search).has('view')) { location.replace('apps-deck.html'); }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Gallery — Linlin Jia</title>
<meta name="description" content="App gallery of Linlin Jia — switch between visual Cards and a Detailed list; filter, search, and sort open-source libraries, LLM/agent platforms, and applied ML tools.">
<link rel="canonical" href="https://jajupmochi.github.io/apps-gallery.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;700&family=Patrick+Hand&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- homepage design system: project-card / filter-tag / search-box / sort-select / pimg carousel -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/parchment-overrides.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231e3a8a' width='32' height='32' rx='7'/%3E%3Ctext x='50%25' y='74%25' text-anchor='middle' fill='white' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-size='22' font-weight='900'%3E%E6%9E%97%3C/text%3E%3C/svg%3E">
<style>
  :root{ --maroon:#9a2b1e; --ink:#3a2c20; --soft:#6b5436; }
  body, p, span, h3, li { font-family:'Spectral','Noto Serif SC',Georgia,serif; }
  /* ---- top bar ---- */
  .pf-nav { position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    padding:0.7em 2vw; background:rgba(247,240,224,0.86); backdrop-filter:saturate(1.1) blur(2px); border-bottom:1px solid rgba(120,80,40,0.22); }
  .pf-brand { display:flex; align-items:center; gap:0.5em; font-family:'Patrick Hand',cursive; font-size:1.35rem; color:var(--ink); text-decoration:none; }
  .pf-brand .mk { width:30px; height:30px; border-radius:8px; background:linear-gradient(150deg,#1e3a8a,#2b4db8); color:#fff; display:grid; place-items:center; font-family:sans-serif; font-weight:900; font-size:0.85rem; }
  .pf-nav .links { display:flex; gap:1.3em; font-size:1.05rem; }
  .pf-nav .links a { color:var(--soft); text-decoration:none; } .pf-nav .links a:hover { color:var(--maroon); }
  .pf-head { max-width:1600px; margin:0 auto; padding:2em 2vw 0.2em; }
  .pf-title { font-family:'Patrick Hand',cursive; font-size:clamp(2.2rem,5vw,3.4rem); color:var(--ink); margin:0; }
  /* ---- controls row (homepage .section-controls style) + view toggle ---- */
  .pf-controls { max-width:1600px; margin:0 auto; padding:0.6em 2vw 0.2em; }
  .pf-controls .section-controls { margin:0; }
  .mode { display:inline-flex; border:1px solid rgba(120,80,40,0.3); border-radius:999px; overflow:hidden; margin-left:auto; }
  .mode button, .mode a { font-family:'JetBrains Mono',monospace; font-size:0.74rem; padding:0.4em 0.9em; color:var(--soft); background:none; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:0.35em; text-decoration:none; }
  .mode button.on { background:var(--maroon); color:#fdf3e3; }
  .mode a.mode-deck { color:var(--maroon); border-right:1px solid rgba(120,80,40,0.25); }
  .mode a.mode-deck:hover { background:rgba(120,80,40,0.12); }
  /* ---- gallery grids ---- */
  .gal { max-width:1600px; margin:0 auto; padding:1.2em 2vw 1em; }
  .gal--cards { display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; grid-auto-flow:dense; gap:1.4em; }
  .gal--detailed { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1.7em; align-items:stretch; }
  .gal-empty { grid-column:1/-1; text-align:center; color:var(--soft); font-family:'Patrick Hand',cursive; font-size:1.3rem; padding:2em 0; display:none; }
  .gal-empty.on { display:block; }
  @media (max-width:1024px){ .gal--cards { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .gal--cards { grid-template-columns:1fr; } .pf-nav .links{ gap:0.8em; font-size:0.92rem; } }
  /* ---- Cards view: image-forward tile + bento variety ---- */
  .g-card { position:relative; aspect-ratio:16/10; overflow:hidden; cursor:pointer; background:transparent;
    transition:transform .4s cubic-bezier(.22,1,.36,1); touch-action:pan-y; }
  .g-card:hover { transform:translateY(-3px); }
  .g-card:focus-visible { outline:2px solid var(--maroon); outline-offset:3px; }
  /* bento: the large featured tile spans 2 columns + 2 rows; one md featured spans 2 rows */
  .gal--cards .g-card--lg { grid-column:span 2; grid-row:span 2; aspect-ratio:auto; }
  .gal--cards .g-card--featured:not(.g-card--lg):nth-of-type(3n) { grid-row:span 2; aspect-ratio:auto; }
  @media (max-width:600px){ .gal--cards .g-card--lg, .gal--cards .g-card--featured { grid-column:auto; grid-row:auto; aspect-ratio:16/10; } }
  .g-imgwrap { position:absolute; inset:0; overflow:hidden; transition:transform .5s cubic-bezier(.22,1,.36,1), filter .5s, opacity .5s; }
  .g-track { display:flex; height:100%; transition:transform .45s cubic-bezier(.22,1,.36,1); }
  .g-slide { min-width:100%; height:100%; object-fit:cover; display:block; }
  .g-dots { position:absolute; left:0; right:0; bottom:9px; z-index:5; display:flex; justify-content:center; gap:6px; transition:opacity .35s; }
  .g-dots i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.55); box-shadow:0 0 3px rgba(40,20,5,0.5); cursor:pointer; transition:transform .2s, background .2s; }
  .g-dots i.on { background:#fff; transform:scale(1.3); }
  .g-cap { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:1.5em 1em 1.1em;
    font-family:'Patrick Hand',cursive; font-size:1.45rem; color:#fff;
    background:linear-gradient(180deg, transparent, rgba(40,22,8,0.8)); transition:opacity .35s; }
  .g-over { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; justify-content:flex-end;
    padding:18px 20px; gap:7px; opacity:0; transition:opacity .4s; overflow:hidden; line-height:1.32;
    background:linear-gradient(180deg, rgba(247,240,224,0.32), rgba(247,240,224,0.96)); }
  .g-over h3 { font-family:'Patrick Hand',cursive; font-size:23px; margin:0; color:var(--ink); line-height:1.12; }
  .g-over p { margin:0; font-size:14.5px; line-height:1.42; color:#4c3a24; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .g-over .why { font-style:italic; color:#6b5436; font-size:13px; -webkit-line-clamp:2; }
  .g-over .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .g-over .tag { font-family:'JetBrains Mono',monospace; font-size:10.5px; line-height:1.6; color:var(--maroon); background:rgba(154,43,30,0.08); border:1px solid rgba(154,43,30,0.2); border-radius:6px; padding:1px 7px; }
  .g-over .acts { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:2px; font-family:'Patrick Hand',cursive; font-size:15.5px; }
  .g-over .acts a, .g-over .acts button { color:var(--maroon); text-decoration:none; background:none; border:none; cursor:pointer; font:inherit; display:inline-flex; align-items:center; gap:0.3em; padding:0; }
  .g-over .acts a:hover, .g-over .acts button:hover { text-decoration:underline; }
  .g-over .acts .zoom { margin-left:auto; }
  .g-card:hover .g-imgwrap, .g-card.is-open .g-imgwrap { transform:scale(0.94); filter:blur(3px) brightness(0.6); opacity:0.4; }
  .g-card:hover .g-over, .g-card.is-open .g-over { opacity:1; }
  .g-card:hover .g-cap, .g-card.is-open .g-cap, .g-card:hover .g-dots, .g-card.is-open .g-dots { opacity:0; }
  .g-tape { position:absolute; top:13px; left:-34px; z-index:6; transform:rotate(-32deg);
    font-family:'Patrick Hand',cursive; font-size:0.8rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#5a3a16;
    padding:0.25em 2.6em; box-shadow:0 3px 7px rgba(80,50,15,0.3);
    background:linear-gradient(135deg, rgba(228,206,146,0.95), rgba(206,178,112,0.9)); clip-path:polygon(2% 0,98% 5%,100% 95%,0 100%); }
  /* ---- Detailed view: washi tape on featured project-cards ---- */
  .gal--detailed .project-card { position:relative; cursor:pointer; height:100%; }
  .pf-tape { position:absolute; top:16px; left:-36px; transform:rotate(-32deg); z-index:6;
    font-family:'Patrick Hand',cursive; font-size:0.84rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#5a3a16;
    padding:0.28em 2.6em; box-shadow:0 3px 7px rgba(80,50,15,0.30);
    background:linear-gradient(135deg, rgba(228,206,146,0.94), rgba(206,178,112,0.9)); clip-path:polygon(2% 0%,98% 5%,100% 95%,0% 100%); }
  .proj-why { color:#6b5436; font-size:0.9rem; margin:0.3em 0 0; }
  /* ---- lightbox ---- */
  .lb { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:rgba(30,18,8,0.85); padding:3vw; }
  .lb.on { display:flex; }
  .lb img { max-width:88vw; max-height:88vh; border-radius:8px; box-shadow:0 30px 60px rgba(0,0,0,0.5); background:#fff; }
  .lb .x { position:absolute; top:3vw; right:4vw; color:#fff; font-size:2rem; cursor:pointer; background:none; border:none; }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:3rem; line-height:1; cursor:pointer; background:none; border:none; padding:0 1.5vw; opacity:0.7; }
  .lb .nav:hover { opacity:1; } .lb .prev { left:1vw; } .lb .next { right:1vw; }
  .lbcount { position:absolute; bottom:2.4vw; left:50%; transform:translateX(-50%); color:#fdf3e3; font-family:'JetBrains Mono',monospace; font-size:0.82rem; letter-spacing:0.1em; opacity:0.8; }
  /* ---- footer ---- */
  .pf-foot { max-width:1600px; margin:1.4em auto 0; padding:2.2em 2vw 3.2em; text-align:center; border-top:1px solid rgba(120,80,40,0.22); }
  .pf-foot .tags { display:flex; flex-wrap:wrap; justify-content:center; gap:0.8em; margin:0 0 1em; }
  .pf-foot .tags a { font-family:'Patrick Hand',cursive; font-size:1.2rem; color:var(--maroon); text-decoration:none;
    border:1px solid rgba(120,80,40,0.25); border-radius:8px 5px 9px 5px; padding:0.3em 1.1em; background:rgba(255,250,235,0.6); }
  .pf-foot .copy { font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--soft); }
  @media (prefers-reduced-motion: reduce){ .g-card, .g-imgwrap, .g-track, .g-over, .g-cap, .g-dots { transition:none !important; } .g-card:hover { transform:none; } }
</style>
</head>
<body data-theme="academic">

<nav class="pf-nav">
  <a class="pf-brand" href="index_en.html"><span class="mk">林</span> Linlin Jia</a>
  <div class="links">
    <a href="index_en.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="https://github.com/jajupmochi" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

<header class="pf-head">
  <h1 class="pf-title">App Gallery</h1>
</header>

<div class="pf-controls">
  <div class="section-controls">
    <div class="filter-tags" id="galFilter" role="group" aria-label="Filter by tag">
      <button class="filter-tag active" data-filter="all">All</button>
      <button class="filter-tag" data-filter="software">Software</button>
      <button class="filter-tag" data-filter="llm">LLM</button>
      <button class="filter-tag" data-filter="agents">Agents</button>
      <button class="filter-tag" data-filter="graph">Graph</button>
      <button class="filter-tag" data-filter="vision">Vision</button>
      <button class="filter-tag" data-filter="spatio-temporal">Spatio-temporal</button>
      <button class="filter-tag" data-filter="industry">Industry</button>
      <button class="filter-tag" data-filter="academia">Academia</button>
      <button class="filter-tag" data-filter="fun">Fun</button>
    </div>
    <div class="search-box">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input type="text" id="galSearch" placeholder="Search apps..." aria-label="Search apps">
    </div>
    <select class="sort-select" id="galSort" aria-label="Sort apps">
      <option value="featured" selected>Featured</option>
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>
    <div class="mode" id="galMode" role="group" aria-label="View mode">
      <a class="mode-deck" href="apps-deck.html" title="Deck — full-screen slide view (default)"><i class="fas fa-clone"></i> Deck</a>
      <button type="button" class="on" data-view="cards"><i class="fas fa-table-cells-large"></i> Cards</button>
      <button type="button" data-view="detailed"><i class="fas fa-list"></i> Detailed</button>
    </div>
  </div>
</div>

<main class="gal gal--cards" id="gal"></main>

<footer class="pf-foot">
  <div class="tags">
    <a href="index_en.html"><i class="fas fa-house"></i> Home</a>
    <a href="blog.html"><i class="fas fa-feather"></i> Blog</a>
    <a href="https://github.com/jajupmochi" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
  </div>
  <p class="copy">© <span id="yr"></span> Linlin Jia</p>
</footer>

<script src="js/projects-data.js"></script>
<script src="js/projects-render.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  Projects.mountGallery({
    mount: '#gal', filter: '#galFilter', search: '#galSearch',
    sort: '#galSort', toggle: '#galMode',
    view: (new URLSearchParams(location.search).get('view') === 'detailed' ? 'detailed' : 'cards')
  });
</script>
</body>
</html>
