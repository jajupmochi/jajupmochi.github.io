<!DOCTYPE html>
<html lang="en" data-site="deck">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Codex — Linlin Jia</title>
<meta name="description" content="A full-screen codex of Linlin Jia's built works: one app per page, leafed like a book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231e3a8a' width='32' height='32' rx='7'/%3E%3Ctext x='50%25' y='74%25' text-anchor='middle' fill='white' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-size='22' font-weight='900'%3E%E6%9E%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink: oklch(0.26 0.04 45);
    --ink-soft: oklch(0.42 0.04 42);
    --ink-faint: oklch(0.55 0.04 50);
    --cinnabar: oklch(0.50 0.18 30);
    --maroon: oklch(0.45 0.15 30);
    --gilt: oklch(0.66 0.12 78);
    --gilt-deep: oklch(0.58 0.12 72);
    --qing: oklch(0.45 0.12 175);
    --rule: oklch(0.5 0.06 45 / 0.32);
    --cream: oklch(0.93 0.030 78);
    --disp: 'Patrick Hand', 'LXGW WenKai', cursive;
    --serif: 'Spectral', 'LXGW WenKai', Georgia, serif;
    --mono: 'JetBrains Mono', 'LXGW WenKai', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  html{
    background:
      url("res/parchment-options/wm-02-pergament-aged.jpg") center / cover no-repeat fixed,
      var(--cream);
    color: var(--ink);
    font-family: var(--serif);
  }
  body { background: transparent; }

  /* ===== deck shell ===== */
  .deck { width:100vw; height:100vh; height:100dvh; }
  .deck-slide{
    position:relative; width:100%; height:100%;
    display:grid; align-items:center;
    padding: clamp(2rem, 5vw, 5.5rem) clamp(1.6rem, 6vw, 7rem);
    overflow:hidden;
  }
  /* plate variant: asymmetric two columns, side alternates */
  .deck-slide--plate{ grid-template-columns: 1.15fr 0.85fr; gap: clamp(1.4rem,4vw,4.5rem); }
  .deck-slide--plate.flip{ grid-template-columns: 0.85fr 1.15fr; }
  .deck-slide--plate.flip .plate{ order:2; }
  /* specimen variant: centered plate, caption-under, margin headline floated */
  .deck-slide--specimen{ grid-template-columns: 1fr; justify-items:center; }

  /* ===== the mounted plate (screenshot / diagram) ===== */
  .plate{ position:relative; max-width:100%; }
  .plate-frame{
    position:relative; padding: clamp(8px,1vw,16px);
    background: oklch(0.96 0.015 86);
    border:1px solid var(--rule);
    box-shadow: 0 1px 0 oklch(1 0 0 / 0.6) inset, 0 18px 40px oklch(0.3 0.04 50 / 0.22), 0 3px 8px oklch(0.3 0.04 50 / 0.18);
    border-radius: 3px;
  }
  .deck-slide--plate .plate-frame{ transform: rotate(-0.6deg); }
  .deck-slide--plate.flip .plate-frame{ transform: rotate(0.7deg); }
  .swiper-zoom-container{ display:block; border-radius:2px; overflow:hidden; }
  .plate-img{ display:block; width:100%; height:auto; max-height: 76vh; object-fit:cover; }
  .deck-slide--specimen .plate-frame{ background: oklch(0.97 0.012 86); padding: clamp(14px,2vw,30px); }
  .deck-slide--specimen .plate-img{ max-height: 58vh; object-fit:contain; }
  .deck-slide--specimen .plate{ max-width: min(72vw, 880px); }
  /* washi tape on featured */
  .plate-tape{
    position:absolute; top:-13px; left:-26px; z-index:3; transform:rotate(-24deg);
    font-family:var(--disp); font-size:0.82rem; letter-spacing:0.18em; text-transform:uppercase; color:#5a3a16;
    padding:0.2em 2.2em; box-shadow:0 3px 7px oklch(0.4 0.05 40 / 0.3);
    background: linear-gradient(135deg, oklch(0.86 0.07 86 / 0.95), oklch(0.78 0.09 84 / 0.92));
    clip-path: polygon(2% 0,98% 6%,100% 96%,0 100%);
  }
  .plate-expand{
    position:absolute; right:10px; bottom:10px; z-index:3;
    font-family:var(--mono); font-size:0.66rem; letter-spacing:0.08em;
    background: oklch(0.96 0.02 86 / 0.85); color:var(--ink-soft);
    border:1px solid var(--rule); border-radius:6px 4px 7px 4px; padding:0.2em 0.6em; cursor:pointer;
    opacity:0; transition: opacity .25s;
  }
  .plate:hover .plate-expand{ opacity:1; }
  /* wax seal for NDA */
  .plate.sealed::after{
    content:""; position:absolute; right:-18px; bottom:-18px; width:78px; height:78px; z-index:4;
    background: radial-gradient(circle at 38% 34%, oklch(0.55 0.19 28), oklch(0.40 0.17 28) 70%);
    border-radius:50%; box-shadow: 0 6px 14px oklch(0.3 0.1 30 / 0.4), inset 0 2px 6px oklch(1 0 0 / 0.18);
    clip-path: polygon(50% 0,62% 12%,80% 8%,82% 27%,98% 38%,88% 53%,95% 72%,76% 75%,67% 93%,50% 84%,33% 93%,24% 75%,5% 72%,12% 53%,2% 38%,18% 27%,20% 8%,38% 12%);
  }
  .plate.sealed::before{
    content:"NDA"; position:absolute; right:1px; bottom:1px; width:78px; height:78px; z-index:5;
    display:grid; place-items:center; transform: translate(0,0) rotate(-8deg);
    font-family:var(--disp); font-size:0.9rem; color: oklch(0.9 0.04 40 / 0.85); pointer-events:none;
  }
  .deck-slide--plate .plate.sealed .plate-frame{ filter: saturate(0.85) brightness(0.97); }

  /* ===== the margin column ===== */
  .margin{ max-width: 46ch; }
  .deck-slide--specimen .margin{ text-align:center; max-width: 64ch; margin-top: clamp(0.8rem,2vw,1.6rem); }
  .m-role{ font-family:var(--mono); font-size: clamp(0.72rem,1vw,0.86rem); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 0.5em; }
  .m-title{
    font-family:var(--disp); font-weight:400; color:var(--ink);
    font-size: clamp(2.6rem, 6.5vw, 5.6rem); line-height:0.96; margin:0 0 0.32em;
    letter-spacing:0.005em;
  }
  .m-title .hl{ color:var(--cinnabar); }
  .deck-slide--specimen .m-title{ font-size: clamp(2.2rem,5vw,4.4rem); transform: rotate(-0.8deg); }
  .m-desc{ font-family:var(--serif); font-size: clamp(0.98rem,1.15vw,1.18rem); line-height:1.5; color:var(--ink); margin:0 0 1em; }
  .m-why{ font-family:var(--serif); font-style:italic; font-size:0.95rem; color:var(--ink-soft); margin:0 0 1em; }
  .m-tags{ list-style:none; display:flex; flex-wrap:wrap; gap:0.45em; padding:0; margin:0 0 1.1em; }
  .deck-slide--specimen .m-tags{ justify-content:center; }
  .m-tags li{ font-family:var(--mono); font-size:0.72rem; letter-spacing:0.04em; color:var(--maroon);
    border-bottom:1px solid oklch(0.5 0.12 30 / 0.4); padding:0 0.1em 0.1em; }
  .m-acts{ display:flex; flex-wrap:wrap; gap:1.1em; align-items:center; }
  .deck-slide--specimen .m-acts{ justify-content:center; }
  .m-acts a{ font-family:var(--disp); font-size:1.18rem; color:var(--maroon); text-decoration:none; display:inline-flex; align-items:center; gap:0.35em; }
  .m-acts a:hover{ color:var(--cinnabar); }
  .m-acts a .pip{ width:7px; height:7px; border-radius:50%; background:var(--qing); display:inline-block; box-shadow:0 0 6px var(--qing); }

  /* ===== folio number ===== */
  .folio{ position:absolute; bottom: clamp(1.2rem,3vh,2.4rem); right: clamp(1.6rem,4vw,4rem);
    font-family:var(--mono); font-size:0.82rem; letter-spacing:0.18em; color:var(--gilt-deep); }
  .deck-slide--specimen .folio{ right:auto; left:50%; transform:translateX(-50%); }

  /* ===== slide-active reveal (parallax handles depth; this adds life) ===== */
  .deck-slide .m-role,.deck-slide .m-title,.deck-slide .m-desc,.deck-slide .m-why,.deck-slide .m-tags,.deck-slide .m-acts,.deck-slide .plate{
    opacity:0; transform: translateY(10px); }
  .swiper-slide-active .m-role{ animation: rise .5s .05s ease-out forwards; }
  .swiper-slide-active .m-title{ animation: rise .6s .12s ease-out forwards; }
  .swiper-slide-active .m-desc{ animation: rise .6s .22s ease-out forwards; }
  .swiper-slide-active .m-why{ animation: rise .6s .26s ease-out forwards; }
  .swiper-slide-active .m-tags{ animation: rise .6s .30s ease-out forwards; }
  .swiper-slide-active .m-acts{ animation: rise .6s .36s ease-out forwards; }
  .swiper-slide-active .plate{ animation: rise .7s .04s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  /* ===== marginalia controls ===== */
  /* bottom gilt page-edge slider (pagination) */
  .deck-folio{ position:fixed; left:0; right:0; bottom:0; z-index:20; height:34px;
    display:flex; align-items:center; justify-content:center; gap:5px;
    opacity:0; transition: opacity .4s; pointer-events:none; }
  .deck.controls-on ~ .deck-folio, body.controls-on .deck-folio{ opacity:1; pointer-events:auto; }
  .deck-folio::before{ content:""; position:absolute; left:8vw; right:8vw; bottom:16px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gilt) 12%, var(--gilt) 88%, transparent); }
  .deck-folio .tick{ position:relative; width:11px; height:11px; border:none; background:transparent; cursor:pointer; padding:0; }
  .deck-folio .tick::after{ content:""; position:absolute; left:50%; bottom:4px; width:1px; height:8px; transform:translateX(-50%);
    background: var(--gilt-deep); opacity:0.5; transition: all .2s; }
  .deck-folio .tick.on::after{ height:14px; bottom:2px; opacity:1; width:2px; background:var(--cinnabar); }

  /* left/right page-turn zones */
  .deck-edge{ position:fixed; top:0; bottom:0; width:13vw; max-width:160px; z-index:18; cursor:pointer;
    display:flex; align-items:center; border:none; background:transparent; }
  .deck-edge--prev{ left:0; justify-content:flex-start; padding-left:1.4vw; }
  .deck-edge--next{ right:0; justify-content:flex-end; padding-right:1.4vw; }
  .deck-edge i{ font-size:2.2rem; color:var(--ink-soft); opacity:0; transition: opacity .3s, transform .3s; }
  .deck-edge--prev i{ transform: translateX(8px); }
  .deck-edge--next i{ transform: translateX(-8px); }
  .deck-edge:hover i{ opacity:0.7; transform: translateX(0); }

  /* top ribbon */
  .deck-ribbon{ position:fixed; top:0; left:0; right:0; z-index:22;
    display:flex; align-items:center; gap:1.1em; flex-wrap:wrap;
    padding:0.6em clamp(1rem,3vw,2.4rem);
    background: linear-gradient(180deg, oklch(0.92 0.03 80 / 0.96), oklch(0.92 0.03 80 / 0.0));
    transform: translateY(-105%); transition: transform .42s cubic-bezier(0.16,1,0.3,1); }
  body.controls-on .deck-ribbon, .deck-ribbon:hover, .deck-ribbon:focus-within{ transform: translateY(0); }
  .deck-ribbon .brand{ font-family:var(--disp); font-size:1.25rem; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:0.4em; }
  .deck-ribbon .brand .mk{ width:26px;height:26px;border-radius:7px;background:linear-gradient(150deg,#1e3a8a,#2b4db8);color:#fff;display:grid;place-items:center;font-family:sans-serif;font-weight:900;font-size:0.78rem; }
  .deck-search{ display:flex; align-items:center; gap:0.4em; background: oklch(0.97 0.012 85 / 0.7);
    border:1px solid var(--rule); border-radius:8px; padding:0.28em 0.7em; color:var(--ink-soft); }
  .deck-search input{ border:none; background:transparent; outline:none; font-family:var(--serif); font-size:0.9rem; color:var(--ink); width:9em; }
  .deck-tags{ display:flex; flex-wrap:wrap; gap:0.35em; }
  .deck-tags .t{ font-family:var(--mono); font-size:0.68rem; color:var(--ink-soft); cursor:pointer;
    background:transparent; border:1px solid var(--rule); border-radius:6px 4px 7px 4px; padding:0.18em 0.6em; }
  .deck-tags .t:hover{ color:var(--maroon); border-color: oklch(0.5 0.12 30 / 0.5); }
  .deck-tags .t.on{ background:var(--maroon); color: oklch(0.95 0.02 85); border-color:var(--maroon); }
  .deck-tools{ margin-left:auto; display:flex; align-items:center; gap:0.8em; }
  .deck-tools button{ background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:1rem; display:inline-flex; align-items:center; gap:0.3em; font-family:var(--mono); }
  .deck-tools button:hover{ color:var(--maroon); }
  .deck-index{ display:flex; flex-wrap:wrap; gap:0.2em 0.9em; width:100%; padding-top:0.2em; }
  .deck-index button{ font-family:var(--serif); font-size:0.84rem; color:var(--ink-soft); background:transparent; border:none; cursor:pointer; padding:0; }
  .deck-index button:hover{ color:var(--maroon); }
  .deck-index button.on{ color:var(--cinnabar); }

  .deck-empty{ position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    font-family:var(--disp); font-size:1.6rem; color:var(--ink-soft); z-index:5; }
  .deck-empty.on{ display:flex; }

  /* lightbox */
  .deck-lb{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background: oklch(0.2 0.03 40 / 0.86); padding:3vw; }
  .deck-lb.on{ display:flex; }
  .deck-lb img{ max-width:92vw; max-height:92vh; border-radius:4px; box-shadow:0 30px 70px oklch(0 0 0 / 0.5); background:#fff; }
  .deck-lb .x{ position:absolute; top:3vw; right:4vw; font-size:2rem; color:oklch(0.95 0.02 85); background:none; border:none; cursor:pointer; }

  /* mobile: force a landscape composition by rotating the deck 90deg in portrait */
  .deck-hint{ position:fixed; inset:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1em;
    background: var(--cream); color:var(--ink); text-align:center; font-family:var(--disp); }
  .deck-hint i{ font-size:3rem; color:var(--maroon); animation: tilt 2s ease-in-out infinite; }
  .deck-hint p{ font-size:1.3rem; max-width:18ch; }
  @keyframes tilt{ 0%,100%{ transform: rotate(0); } 50%{ transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 820px){
    /* render the deck as landscape inside a portrait viewport: size it to the
       swapped dimensions and rotate 90deg about the centre (robust recipe). */
    .deck-rotor{ position:fixed; top:50%; left:50%;
      width:100vh; height:100vw; transform-origin: center center; transform: translate(-50%,-50%) rotate(90deg); }
    .deck, .deck .deck-slide{ width:100vh; height:100vw; }
    .deck-hint{ display:flex; }
    .deck-hint.dismissed{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .deck-slide .m-role,.deck-slide .m-title,.deck-slide .m-desc,.deck-slide .m-why,.deck-slide .m-tags,.deck-slide .m-acts,.deck-slide .plate{ opacity:1; transform:none; animation:none !important; }
    .deck-hint i{ animation:none; }
  }
</style>
</head>
<body>

<div class="deck-rotor">
  <div class="swiper deck" id="deck">
    <div class="swiper-wrapper" id="deckWrap"></div>
  </div>
</div>

<!-- marginalia controls -->
<button class="deck-edge deck-edge--prev" id="edgePrev" aria-label="Previous app"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
<button class="deck-edge deck-edge--next" id="edgeNext" aria-label="Next app"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
<div class="deck-folio" id="deckFolio" role="group" aria-label="App index"></div>

<header class="deck-ribbon" id="ribbon">
  <a class="brand" href="index_en.html"><span class="mk">林</span> Codex of works</a>
  <div class="deck-search"><i class="fas fa-search" aria-hidden="true"></i><input type="text" id="deckSearch" placeholder="Search..." aria-label="Search apps"></div>
  <div class="deck-tags" id="deckTags" role="group" aria-label="Filter by tag"></div>
  <div class="deck-tools">
    <button id="btnAuto" title="Play / pause auto-leaf"><i class="fas fa-pause" aria-hidden="true"></i></button>
    <button id="btnFull" title="Fullscreen"><i class="fas fa-expand" aria-hidden="true"></i></button>
    <a class="brand" href="apps-gallery.html" style="font-size:0.8rem;color:var(--ink-soft)" title="Grid view"><i class="fas fa-table-cells-large"></i></a>
  </div>
  <div class="deck-index" id="deckIndex" aria-label="Jump to app"></div>
</header>

<div class="deck-empty" id="deckEmpty">No apps match that filter.</div>

<div class="deck-hint" id="deckHint"><i class="fas fa-mobile-screen-button" aria-hidden="true"></i><p>Turn your phone. This codex reads in landscape.</p></div>

<div class="deck-lb" id="deckLb"><button class="x" id="deckLbX" aria-label="Close">&times;</button><img id="deckLbImg" src="" alt=""></div>

<script src="js/projects-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
(function(){
  'use strict';
  var ROMAN=[[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
  function roman(n){ var s=''; ROMAN.forEach(function(p){ while(n>=p[0]){ s+=p[1]; n-=p[0]; } }); return s; }
  var ALL = (window.PROJECTS||[]).filter(function(p){ return p.show && p.show.gallery; });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function variantOf(p){ var im=(p.images&&p.images[0]&&p.images[0].src)||''; return /\.svg(\?|$)/.test(im) ? 'specimen' : 'plate'; }
  function titleHTML(p){ var t=p.titleShort||p.id; return t.charAt(0).replace(/[<>&]/g,'')+'' === t.charAt(0) ? ('<span class="hl">'+t.charAt(0)+'</span>'+t.slice(1)) : t; }
  function actsHTML(p){
    var live = (p.links||[]).map(function(l){
      var demo = /demo|open|site/i.test(l.label);
      return '<a href="'+l.href+'" target="_blank" rel="noopener noreferrer">'+(demo?'<span class="pip"></span> ':'<i class="'+l.icon+'"></i> ')+l.label+'</a>';
    }).join('');
    return live || '<span class="m-why" style="margin:0">'+(p.why?'':'')+'</span>';
  }
  function slideHTML(p, idx, total){
    var v=variantOf(p), flip = v==='plate' && idx%2===1, sealed = !!p.why;
    var im=(p.images&&p.images[0])||{};
    var tags=(p.tagLabels||[]).slice(0,4).map(function(t){return '<li>'+t+'</li>';}).join('');
    var plate =
      '<div class="plate'+(sealed?' sealed':'')+'" data-swiper-parallax="'+(v==='specimen'?'-90':'-130')+'">'+
        (p.featured?'<span class="plate-tape">Featured</span>':'')+
        '<div class="plate-frame">'+
          '<div class="swiper-zoom-container"><img class="plate-img" src="'+im.src+'" alt="'+(im.alt||'')+'" loading="lazy"></div>'+
          '<button class="plate-expand" data-full="'+im.src+'" type="button">enlarge</button>'+
        '</div>'+
      '</div>';
    var margin =
      '<div class="margin">'+
        '<p class="m-role" data-swiper-parallax="-50">'+(p.badgeText||'')+' · '+(p.date||'')+'</p>'+
        '<h2 class="m-title" data-swiper-parallax="-30">'+titleHTML(p)+'</h2>'+
        '<p class="m-desc" data-swiper-parallax="-20">'+(p.blurb||'')+'</p>'+
        (sealed?'<p class="m-why" data-swiper-parallax="-20">'+p.why+'</p>':'')+
        '<ul class="m-tags" data-swiper-parallax="-16">'+tags+'</ul>'+
        '<div class="m-acts" data-swiper-parallax="-12">'+actsHTML(p)+'</div>'+
      '</div>';
    var inner = v==='specimen' ? (plate+margin) : (flip ? (margin+plate) : (plate+margin));
    return '<div class="swiper-slide deck-slide deck-slide--'+v+(flip?' flip':'')+'" data-hash="'+p.id+'">'+
      inner + '<span class="folio" data-swiper-parallax="-200">'+roman(idx+1)+' / '+roman(total)+'</span>'+
    '</div>';
  }

  var state = { tag:'all', q:'' };
  function filtered(){
    return ALL.filter(function(p){
      var tagHit = state.tag==='all' || (p.tags||[]).indexOf(state.tag)>=0;
      var qHit = !state.q || [p.titleFull,p.titleShort,p.blurb,(p.tagLabels||[]).join(' ')].join(' ').toLowerCase().indexOf(state.q)>=0;
      return tagHit && qHit;
    });
  }
  function buildSlides(){
    var list=filtered(), total=list.length;
    document.getElementById('deckWrap').innerHTML = list.map(function(p,i){ return slideHTML(p,i,total); }).join('');
    document.getElementById('deckEmpty').classList.toggle('on', total===0);
    buildFolio(list); buildIndex(list);
    return list;
  }
  function buildFolio(list){
    var f=document.getElementById('deckFolio');
    f.innerHTML = list.map(function(p,i){ return '<button class="tick" data-i="'+i+'" aria-label="App '+(i+1)+'"></button>'; }).join('');
  }
  function buildIndex(list){
    var idx=document.getElementById('deckIndex');
    idx.innerHTML = list.map(function(p,i){ return '<button data-i="'+i+'">'+(p.titleShort||p.id)+'</button>'; }).join('');
  }
  function buildTags(){
    var set={}; ALL.forEach(function(p){ (p.tags||[]).forEach(function(t){ set[t]=1; }); });
    var order=['all','llm','agents','graph','vision','software','spatio-temporal','industry','academia','fun'].filter(function(t){ return t==='all'||set[t]; });
    document.getElementById('deckTags').innerHTML = order.map(function(t){
      return '<button class="t'+(t==='all'?' on':'')+'" data-tag="'+t+'">'+t+'</button>';
    }).join('');
  }

  buildTags();
  buildSlides();

  var swiper = new Swiper('#deck', {
    speed: 720,
    parallax: true,
    grabCursor: true,
    zoom: { maxRatio: 2.6, toggle: true },
    keyboard: { enabled: true },
    mousewheel: { forceToAxis: true, thresholdDelta: 24 },
    hashNavigation: { watchState: true },
    a11y: { enabled: true },
    autoplay: reduce ? false : { delay: 7000, pauseOnMouseEnter: true, disableOnInteraction: false },
    pagination: { el: '#deckFolio', clickable: true, bulletClass: 'tick', bulletActiveClass: 'on', renderBullet: function(i,cls){ return '<button class="'+cls+'" data-i="'+i+'" aria-label="App '+(i+1)+'"></button>'; } },
    on: {
      activeIndexChange: function(){ syncIndex(this); },
      init: function(){ syncIndex(this); }
    }
  });

  window.__deck = swiper;
  function syncIndex(s){
    s = s || swiper; if(!s) return;
    var ai = s.realIndex || s.activeIndex || 0;
    [].forEach.call(document.querySelectorAll('#deckIndex button'), function(b,i){ b.classList.toggle('on', i===ai); });
  }

  // re-filter → rebuild slides
  function refresh(){
    buildSlides();
    swiper.update();
    swiper.slideTo(0,0);
    swiper.pagination && swiper.pagination.render && swiper.pagination.render();
    swiper.pagination && swiper.pagination.update && swiper.pagination.update();
    if(!reduce && swiper.autoplay){ swiper.autoplay.start(); }
    syncIndex();
  }

  // controls
  document.getElementById('edgePrev').addEventListener('click', function(){ swiper.slidePrev(); });
  document.getElementById('edgeNext').addEventListener('click', function(){ swiper.slideNext(); });
  document.getElementById('deckTags').addEventListener('click', function(e){
    var b=e.target.closest('[data-tag]'); if(!b) return;
    [].forEach.call(this.querySelectorAll('.t'), function(x){ x.classList.toggle('on', x===b); });
    state.tag=b.dataset.tag; refresh();
  });
  document.getElementById('deckSearch').addEventListener('input', function(){ state.q=(this.value||'').trim().toLowerCase(); refresh(); });
  document.getElementById('deckIndex').addEventListener('click', function(e){ var b=e.target.closest('[data-i]'); if(b) swiper.slideTo(+b.dataset.i); });

  // autoplay toggle
  var autoBtn=document.getElementById('btnAuto');
  autoBtn.addEventListener('click', function(){
    if(!swiper.autoplay) return;
    if(swiper.autoplay.running){ swiper.autoplay.stop(); autoBtn.innerHTML='<i class="fas fa-play"></i>'; }
    else { swiper.autoplay.start(); autoBtn.innerHTML='<i class="fas fa-pause"></i>'; }
  });
  if(reduce){ autoBtn.innerHTML='<i class="fas fa-play"></i>'; }

  // fullscreen
  document.getElementById('btnFull').addEventListener('click', function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el).then(function(){
      if(screen.orientation && screen.orientation.lock){ screen.orientation.lock('landscape').catch(function(){}); }
    }).catch(function(){}); }
    else { document.exitFullscreen(); }
  });

  // lightbox (enlarge)
  var lb=document.getElementById('deckLb'), lbImg=document.getElementById('deckLbImg');
  document.getElementById('deckWrap').addEventListener('click', function(e){
    var b=e.target.closest('.plate-expand'); if(!b) return; e.stopPropagation();
    lbImg.src=b.dataset.full; lb.classList.add('on');
  });
  document.getElementById('deckLbX').addEventListener('click', function(){ lb.classList.remove('on'); lbImg.src=''; });
  lb.addEventListener('click', function(e){ if(e.target===lb){ lb.classList.remove('on'); lbImg.src=''; } });

  // reveal controls on mouse-move / near top; idle-hide
  var idleT;
  function showControls(){ document.body.classList.add('controls-on'); clearTimeout(idleT); idleT=setTimeout(function(){ document.body.classList.remove('controls-on'); }, 2600); }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('keydown', showControls);
  document.getElementById('ribbon').addEventListener('mouseenter', function(){ clearTimeout(idleT); });

  // mobile rotate hint dismiss on orientation change
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ document.getElementById('deckHint').classList.toggle('dismissed', !window.matchMedia('(orientation: portrait)').matches); }, 300); });
  document.getElementById('deckHint').addEventListener('click', function(){ this.classList.add('dismissed'); });
})();
</script>
</body>
</html>
