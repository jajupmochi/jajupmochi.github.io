<!DOCTYPE html>
<html lang="en" data-site="deck">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apps — Linlin Jia</title>
<meta name="description" content="A full-screen view of Linlin Jia's built works: one app per page, leafed like a book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<!-- reuse the gallery's controls design (filter-tag / search-box / sort-select / section-controls) + parchment -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/parchment-overrides.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231e3a8a' width='32' height='32' rx='7'/%3E%3Ctext x='50%25' y='74%25' text-anchor='middle' fill='white' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-size='22' font-weight='900'%3E%E6%9E%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink: oklch(0.26 0.04 45); --ink-soft: oklch(0.42 0.04 42);
    --cinnabar: oklch(0.50 0.18 30); --maroon: oklch(0.45 0.15 30);
    --gilt: oklch(0.66 0.12 78); --gilt-deep: oklch(0.58 0.12 72);
    --qing: oklch(0.45 0.12 175); --rule: oklch(0.5 0.06 45 / 0.32); --cream: oklch(0.93 0.030 78);
    --disp: 'Patrick Hand','LXGW WenKai',cursive; --serif: 'Spectral','LXGW WenKai',Georgia,serif; --mono: 'JetBrains Mono','LXGW WenKai',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0 !important; padding:0 !important; height:100%; max-width:none !important; overflow:hidden !important; font-family:var(--serif); color:var(--ink); }
  body{ background:transparent !important; }

  .deck{ width:100vw; height:100vh; height:100dvh; }
  .deck-slide{ position:relative; width:100%; height:100%; display:grid; align-items:center;
    padding: clamp(2rem,5vw,5.5rem) clamp(3.4rem,8vw,8.5rem); overflow:hidden; }
  .deck-slide--plate{ grid-template-columns:1.15fr 0.85fr; gap:clamp(1.4rem,4vw,4.5rem); }
  .deck-slide--plate.flip{ grid-template-columns:0.85fr 1.15fr; }
  .deck-slide--plate.flip .plate{ order:2; }
  .deck-slide--specimen{ grid-template-columns:1fr; justify-items:center; }

  /* plate (screenshot / diagram), with optional in-plate image rotator */
  .plate{ position:relative; max-width:100%; }
  .plate-frame{ position:relative; padding:clamp(8px,1vw,16px); background:oklch(0.96 0.015 86); border:1px solid var(--rule);
    box-shadow:0 1px 0 oklch(1 0 0 / 0.6) inset, 0 18px 40px oklch(0.3 0.04 50 / 0.22), 0 3px 8px oklch(0.3 0.04 50 / 0.18); border-radius:3px; }
  .deck-slide--plate .plate-frame{ transform:rotate(-0.6deg); }
  .deck-slide--plate.flip .plate-frame{ transform:rotate(0.7deg); }
  /* fixed-aspect plate box; all screenshots shown whole (contain), matted on cream
     so mixed desktop/mobile aspect ratios both read cleanly */
  .rstack{ position:relative; width:100%; aspect-ratio:16/10; cursor:zoom-in; border-radius:2px; overflow:hidden; background:oklch(0.95 0.012 86); }
  .rimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .8s ease; }
  .rimg.on{ opacity:1; }
  .deck-slide--specimen .rstack{ aspect-ratio:16/9; background:oklch(0.97 0.012 86); }
  .deck-slide--specimen .plate-frame{ background:oklch(0.97 0.012 86); padding:clamp(14px,2vw,30px); }
  .deck-slide--specimen .plate{ max-width:min(70vw,860px); }
  .rdots{ position:absolute; left:0; right:0; bottom:9px; z-index:4; display:flex; justify-content:center; gap:6px; }
  .rdots i{ width:7px; height:7px; border-radius:50%; background:oklch(1 0 0 / 0.6); box-shadow:0 0 3px oklch(0.2 0 0 / 0.5); cursor:pointer; transition:transform .2s, background .2s; }
  .rdots i.on{ background:#fff; transform:scale(1.3); }
  .plate-zoomcue{ position:absolute; top:10px; right:10px; z-index:4; width:30px; height:30px; display:grid; place-items:center;
    background:oklch(0.96 0.02 86 / 0.8); border:1px solid var(--rule); border-radius:50%; color:var(--ink-soft); opacity:0; transition:opacity .25s; pointer-events:none; }
  .plate:hover .plate-zoomcue{ opacity:1; }
  .plate-tape{ position:absolute; top:-13px; left:-26px; z-index:3; transform:rotate(-24deg); font-family:var(--disp); font-size:0.82rem;
    letter-spacing:0.18em; text-transform:uppercase; color:#5a3a16; padding:0.2em 2.2em; box-shadow:0 3px 7px oklch(0.4 0.05 40 / 0.3);
    background:linear-gradient(135deg,oklch(0.86 0.07 86 / 0.95),oklch(0.78 0.09 84 / 0.92)); clip-path:polygon(2% 0,98% 6%,100% 96%,0 100%); }
  .plate.sealed::after{ content:""; position:absolute; right:-18px; bottom:-18px; width:74px; height:74px; z-index:4;
    background:radial-gradient(circle at 38% 34%,oklch(0.55 0.19 28),oklch(0.40 0.17 28) 70%); border-radius:50%;
    box-shadow:0 6px 14px oklch(0.3 0.1 30 / 0.4), inset 0 2px 6px oklch(1 0 0 / 0.18);
    clip-path:polygon(50% 0,62% 12%,80% 8%,82% 27%,98% 38%,88% 53%,95% 72%,76% 75%,67% 93%,50% 84%,33% 93%,24% 75%,5% 72%,12% 53%,2% 38%,18% 27%,20% 8%,38% 12%); }
  .plate.sealed .seal-txt{ position:absolute; right:1px; bottom:1px; width:74px; height:74px; z-index:5; display:grid; place-items:center;
    transform:rotate(-8deg); font-family:var(--disp); font-size:0.86rem; color:oklch(0.9 0.04 40 / 0.85); pointer-events:none; }

  .margin{ max-width:46ch; }
  .deck-slide--specimen .margin{ text-align:center; max-width:64ch; margin-top:clamp(0.8rem,2vw,1.6rem); }
  .m-role{ font-family:var(--mono); font-size:clamp(0.72rem,1vw,0.86rem); letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 0.5em; }
  .m-title{ font-family:var(--disp); font-weight:400; color:var(--ink); font-size:clamp(2.6rem,6.5vw,5.6rem); line-height:0.96; margin:0 0 0.32em; }
  .m-title .hl{ color:var(--cinnabar); }
  .deck-slide--specimen .m-title{ font-size:clamp(2.2rem,5vw,4.4rem); transform:rotate(-0.8deg); }
  .m-desc{ font-family:var(--serif); font-size:clamp(0.98rem,1.15vw,1.18rem); line-height:1.5; color:var(--ink); margin:0 0 1em; }
  .m-why{ font-family:var(--serif); font-style:italic; font-size:0.95rem; color:var(--ink-soft); margin:0 0 1em; }
  .m-tags{ list-style:none; display:flex; flex-wrap:wrap; gap:0.45em; padding:0; margin:0 0 1.1em; }
  .deck-slide--specimen .m-tags{ justify-content:center; }
  .m-tags li{ font-family:var(--mono); font-size:0.72rem; letter-spacing:0.04em; color:var(--maroon); border-bottom:1px solid oklch(0.5 0.12 30 / 0.4); padding:0 0.1em 0.1em; }
  .m-acts{ display:flex; flex-wrap:wrap; gap:1.1em; align-items:center; }
  .deck-slide--specimen .m-acts{ justify-content:center; }
  .m-acts a{ font-family:var(--disp); font-size:1.18rem; color:var(--maroon); text-decoration:none; display:inline-flex; align-items:center; gap:0.35em; }
  .m-acts a:hover{ color:var(--cinnabar); }
  .m-acts a .pip{ width:7px; height:7px; border-radius:50%; background:var(--qing); display:inline-block; box-shadow:0 0 6px var(--qing); }
  .folio{ position:absolute; bottom:clamp(1.2rem,3vh,2.4rem); right:clamp(1.6rem,4vw,4rem); font-family:var(--mono); font-size:0.82rem; letter-spacing:0.18em; color:var(--gilt-deep); }
  .deck-slide--specimen .folio{ right:auto; left:50%; transform:translateX(-50%); }

  /* entrance reveal */
  .deck-slide .m-role,.deck-slide .m-title,.deck-slide .m-desc,.deck-slide .m-why,.deck-slide .m-tags,.deck-slide .m-acts,.deck-slide .plate{ opacity:0; transform:translateY(10px); }
  .swiper-slide-active .m-role{ animation:rise .5s .05s ease-out forwards; }
  .swiper-slide-active .m-title{ animation:rise .6s .12s ease-out forwards; }
  .swiper-slide-active .m-desc{ animation:rise .6s .22s ease-out forwards; }
  .swiper-slide-active .m-why{ animation:rise .6s .26s ease-out forwards; }
  .swiper-slide-active .m-tags{ animation:rise .6s .30s ease-out forwards; }
  .swiper-slide-active .m-acts{ animation:rise .6s .36s ease-out forwards; }
  .swiper-slide-active .plate{ animation:rise .7s .04s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  /* ===== big left/right navigation arrows ===== */
  .deck-arrow{ position:fixed; top:50%; transform:translateY(-50%); z-index:24; width:clamp(48px,5vw,68px); height:clamp(48px,5vw,68px);
    display:grid; place-items:center; border-radius:50%; cursor:pointer;
    background:oklch(0.95 0.025 84 / 0.78); border:1px solid var(--rule); color:var(--maroon);
    box-shadow:0 6px 18px oklch(0.3 0.04 50 / 0.2); font-size:clamp(1.3rem,2vw,1.8rem);
    opacity:0; transition:opacity .35s, transform .35s, background .2s; }
  .deck-arrow--prev{ left:clamp(0.8rem,2vw,2rem); }
  .deck-arrow--next{ right:clamp(0.8rem,2vw,2rem); }
  .deck-arrow:hover{ background:oklch(0.96 0.03 84 / 0.95); transform:translateY(-50%) scale(1.06); }
  body.controls-on .deck-arrow{ opacity:1; }
  body.single .deck-arrow, body.single .deck-folio{ display:none; }  /* nothing to leaf to */
  /* first-load teaching nudge: arrows appear + pulse left-right so users know it leafs */
  body.intro .deck-arrow{ opacity:1; }
  body.intro .deck-arrow--prev{ animation:nudgeL 1.1s ease-in-out 2; }
  body.intro .deck-arrow--next{ animation:nudgeR 1.1s ease-in-out 2; }
  @keyframes nudgeL{ 0%,100%{ transform:translateY(-50%) translateX(0); } 50%{ transform:translateY(-50%) translateX(-10px); } }
  @keyframes nudgeR{ 0%,100%{ transform:translateY(-50%) translateX(0); } 50%{ transform:translateY(-50%) translateX(10px); } }
  .deck-onboard{ position:fixed; left:50%; bottom:clamp(3rem,8vh,6rem); transform:translateX(-50%); z-index:25;
    font-family:var(--disp); font-size:1.05rem; color:var(--ink); background:oklch(0.95 0.025 84 / 0.9); border:1px solid var(--rule);
    border-radius:9px 5px 10px 6px; padding:0.4em 1.1em; box-shadow:0 6px 16px oklch(0.3 0.04 50 / 0.18); opacity:0; pointer-events:none; }
  body.intro .deck-onboard{ animation:onb 4.5s ease forwards; }
  @keyframes onb{ 0%{ opacity:0; transform:translateX(-50%) translateY(8px); } 12%,75%{ opacity:1; transform:translateX(-50%) translateY(0); } 100%{ opacity:0; } }

  /* ===== top ribbon (reuses gallery .section-controls / .filter-tag / .search-box / .sort-select) ===== */
  .deck-ribbon{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:1em; flex-wrap:wrap;
    padding:0.55em clamp(1rem,3vw,2.4rem); background:linear-gradient(180deg,oklch(0.92 0.03 80 / 0.97),oklch(0.92 0.03 80 / 0));
    transform:translateY(-105%); transition:transform .42s cubic-bezier(0.16,1,0.3,1); }
  body.controls-on .deck-ribbon, .deck-ribbon:hover, .deck-ribbon:focus-within{ transform:translateY(0); }
  .deck-ribbon .brand{ font-family:var(--disp); font-size:1.2rem; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:0.4em; }
  .deck-ribbon .brand .mk{ width:26px; height:26px; border-radius:7px; background:linear-gradient(150deg,#1e3a8a,#2b4db8); color:#fff; display:grid; place-items:center; font-family:sans-serif; font-weight:900; font-size:0.78rem; }
  .deck-ribbon .section-controls{ margin:0 !important; flex:1; }
  .deck-tools{ display:flex; align-items:center; gap:0.9em; }
  .deck-tools button, .deck-tools a{ background:transparent; border:none; color:var(--ink-soft); cursor:pointer; font-size:1rem; display:inline-flex; align-items:center; text-decoration:none; }
  .deck-tools button:hover, .deck-tools a:hover{ color:var(--maroon); }

  /* autoplay progress bar (very bottom) */
  .deck-prog{ position:fixed; left:0; bottom:0; height:3px; width:0; z-index:21; background:linear-gradient(90deg,var(--gilt),var(--cinnabar)); transition:width .15s linear; opacity:0.85; }

  /* folio dots (bottom centre), shown with controls */
  .deck-folio{ position:fixed; left:0; right:0; bottom:8px; z-index:20; display:flex; align-items:center; justify-content:center; gap:7px; opacity:0; transition:opacity .4s; pointer-events:none; }
  body.controls-on .deck-folio{ opacity:1; pointer-events:auto; }
  .deck-folio .tick{ width:9px; height:9px; border-radius:50%; border:1px solid var(--gilt-deep); background:transparent; cursor:pointer; padding:0; transition:all .2s; }
  .deck-folio .tick.on{ background:var(--cinnabar); border-color:var(--cinnabar); transform:scale(1.25); }

  .deck-empty{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-family:var(--disp); font-size:1.6rem; color:var(--ink-soft); z-index:5; }
  .deck-empty.on{ display:flex; }

  /* lightbox */
  .deck-lb{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:oklch(0.2 0.03 40 / 0.86); padding:3vw; }
  .deck-lb.on{ display:flex; }
  .deck-lb img{ max-width:92vw; max-height:92vh; border-radius:4px; box-shadow:0 30px 70px oklch(0 0 0 / 0.5); background:#fff; }
  .deck-lb button{ position:absolute; background:none; border:none; color:oklch(0.95 0.02 85); cursor:pointer; }
  .deck-lb .x{ top:3vw; right:4vw; font-size:2rem; }
  .deck-lb .nav{ top:50%; transform:translateY(-50%); font-size:3rem; padding:0 1.4vw; opacity:0.75; }
  .deck-lb .nav:hover{ opacity:1; } .deck-lb .prev{ left:1vw; } .deck-lb .next{ right:1vw; }

  /* visually-hidden live region */
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* focus visibility */
  .deck-arrow:focus-visible, .deck-folio .tick:focus-visible, .deck-tools button:focus-visible, .rstack:focus-visible{ outline:2px solid var(--cinnabar); outline-offset:3px; }

  /* mobile: force landscape by rotating the deck; custom touch handler restores swipe */
  .deck-hint{ position:fixed; inset:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center; gap:1em; background:var(--cream); color:var(--ink); text-align:center; font-family:var(--disp); }
  .deck-hint i{ font-size:3rem; color:var(--maroon); animation:tilt 2s ease-in-out infinite; }
  .deck-hint p{ font-size:1.3rem; max-width:18ch; }
  @keyframes tilt{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(90deg); } }
  @media (orientation:portrait) and (max-width:820px){
    .deck-rotor{ position:fixed; top:50%; left:50%; width:100vh; height:100vw; transform-origin:center center; transform:translate(-50%,-50%) rotate(90deg); }
    .deck, .deck .deck-slide{ width:100vh; height:100vw; }
    .deck-hint{ display:flex; } .deck-hint.dismissed{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    .deck-slide .m-role,.deck-slide .m-title,.deck-slide .m-desc,.deck-slide .m-why,.deck-slide .m-tags,.deck-slide .m-acts,.deck-slide .plate{ opacity:1; transform:none; animation:none !important; }
    .deck-hint i, body.intro .deck-arrow{ animation:none; }
    .rstack .rimg{ transition:none; }
  }
</style>
</head>
<body data-theme="academic">

<div class="deck-rotor">
  <div class="swiper deck" id="deck"><div class="swiper-wrapper" id="deckWrap"></div></div>
</div>

<button class="deck-arrow deck-arrow--prev" id="arrowPrev" aria-label="Previous app"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
<button class="deck-arrow deck-arrow--next" id="arrowNext" aria-label="Next app"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
<div class="deck-onboard" id="onboard">Swipe, or use the arrows to leaf through</div>
<div class="deck-prog" id="deckProg"></div>
<div class="deck-folio" id="deckFolio" role="group" aria-label="App index"></div>

<header class="deck-ribbon" id="ribbon">
  <a class="brand" href="index_en.html"><span class="mk">林</span> Linlin Jia</a>
  <div class="section-controls">
    <div class="filter-tags" id="deckTags" role="group" aria-label="Filter by tag"></div>
    <div class="search-box"><i class="fas fa-search" aria-hidden="true"></i><input type="text" id="deckSearch" placeholder="Search apps..." aria-label="Search apps"></div>
    <select class="sort-select" id="deckSort" aria-label="Sort apps">
      <option value="featured" selected>Featured</option>
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
    </select>
  </div>
  <div class="deck-tools">
    <button id="btnAuto" title="Play / pause auto-leaf" aria-label="Play or pause autoplay"><i class="fas fa-pause" aria-hidden="true"></i></button>
    <button id="btnFull" title="Fullscreen" aria-label="Toggle fullscreen"><i class="fas fa-expand" aria-hidden="true"></i></button>
    <a href="apps-gallery.html" title="Grid view" aria-label="Grid view"><i class="fas fa-table-cells-large" aria-hidden="true"></i></a>
  </div>
</header>

<div class="deck-empty" id="deckEmpty">No apps match that filter.</div>
<div class="deck-hint" id="deckHint"><i class="fas fa-mobile-screen-button" aria-hidden="true"></i><p>Turn your phone to view.</p></div>
<div class="sr-only" aria-live="polite" id="deckLive"></div>

<div class="deck-lb" id="deckLb">
  <button class="x" id="deckLbX" aria-label="Close">&times;</button>
  <button class="nav prev" id="deckLbPrev" aria-label="Previous image">&#8249;</button>
  <img id="deckLbImg" src="" alt="">
  <button class="nav next" id="deckLbNext" aria-label="Next image">&#8250;</button>
</div>

<script src="js/projects-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
(function(){
  'use strict';
  var ROMAN=[[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
  function roman(n){ var s=''; ROMAN.forEach(function(p){ while(n>=p[0]){ s+=p[1]; n-=p[0]; } }); return s; }
  var ALL=(window.PROJECTS||[]).filter(function(p){ return p.show && p.show.gallery; });
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isTouch=window.matchMedia('(pointer: coarse)').matches;
  var rotorTimers=[];  // declared before Swiper init (its init callback calls setupRotators)

  function variantOf(p){ var im=(p.images&&p.images[0]&&p.images[0].src)||''; return /\.svg(\?|$)/.test(im)?'specimen':'plate'; }
  function titleHTML(p){ var t=p.titleShort||p.id; return '<span class="hl">'+t.charAt(0)+'</span>'+t.slice(1); }
  function actsHTML(p){
    return (p.links||[]).map(function(l){ var demo=/demo|open|site/i.test(l.label);
      return '<a href="'+l.href+'" target="_blank" rel="noopener noreferrer">'+(demo?'<span class="pip"></span> ':'<i class="'+l.icon+'"></i> ')+l.label+'</a>';
    }).join('');
  }
  function slideHTML(p, idx, total){
    var v=variantOf(p), flip=v==='plate'&&idx%2===1, sealed=!!p.why, imgs=p.images||[];
    var stack=imgs.map(function(im,k){ return '<img class="rimg'+(k===0?' on':'')+'" src="'+im.src+'" alt="'+(im.alt||'')+'" loading="'+(idx<2?'eager':'lazy')+'" decoding="async">'; }).join('');
    var dots = imgs.length>1 ? '<div class="rdots"></div>' : '';
    var tags=(p.tagLabels||[]).slice(0,4).map(function(t){ return '<li>'+t+'</li>'; }).join('');
    var plate='<div class="plate'+(sealed?' sealed':'')+'"'+(imgs.length>1?' data-multi="1"':'')+' data-swiper-parallax="'+(v==='specimen'?'-90':'-130')+'">'+
        (p.featured?'<span class="plate-tape">Featured</span>':'')+
        '<div class="plate-frame">'+
          '<div class="rstack" tabindex="0" role="button" aria-label="Enlarge image">'+stack+'</div>'+ dots +
          '<span class="plate-zoomcue"><i class="fas fa-magnifying-glass-plus"></i></span>'+
        '</div>'+ (sealed?'<span class="seal-txt">NDA</span>':'') + '</div>';
    var margin='<div class="margin">'+
        '<p class="m-role" data-swiper-parallax="-50">'+(p.badgeText||'')+' · '+(p.date||'')+'</p>'+
        '<h2 class="m-title" data-swiper-parallax="-30">'+titleHTML(p)+'</h2>'+
        '<p class="m-desc" data-swiper-parallax="-20">'+(p.blurb||'')+'</p>'+
        (sealed?'<p class="m-why" data-swiper-parallax="-20">'+p.why+'</p>':'')+
        '<ul class="m-tags" data-swiper-parallax="-16">'+tags+'</ul>'+
        '<div class="m-acts" data-swiper-parallax="-12">'+actsHTML(p)+'</div>'+
      '</div>';
    var inner = v==='specimen' ? (plate+margin) : (flip?(margin+plate):(plate+margin));
    return '<div class="swiper-slide deck-slide deck-slide--'+v+(flip?' flip':'')+'" data-hash="'+p.id+'" role="group" aria-roledescription="slide" aria-label="'+(p.titleShort||p.id)+', app '+(idx+1)+' of '+total+'">'+
      inner+'<span class="folio" data-swiper-parallax="-200">'+roman(idx+1)+' / '+roman(total)+'</span></div>';
  }

  var state={ tag:'all', q:'', sort:'featured' };
  function ordered(list){
    var a=list.slice();
    a.sort(function(x,y){ return state.sort==='newest'?(y.year-x.year):state.sort==='oldest'?(x.year-y.year):((y.priority||0)-(x.priority||0)); });
    return a;
  }
  function filtered(){
    return ordered(ALL.filter(function(p){
      var tagHit=state.tag==='all'||(p.tags||[]).indexOf(state.tag)>=0;
      var qHit=!state.q||[p.titleFull,p.titleShort,p.blurb,(p.tagLabels||[]).join(' ')].join(' ').toLowerCase().indexOf(state.q)>=0;
      return tagHit&&qHit;
    }));
  }
  var current=[];
  function buildSlides(){
    current=filtered(); var total=current.length;
    document.getElementById('deckWrap').innerHTML=current.map(function(p,i){ return slideHTML(p,i,total); }).join('');
    document.getElementById('deckEmpty').classList.toggle('on', total===0);
    document.body.classList.toggle('single', total<=1);
    buildFolio(total);
    return current;
  }
  function buildFolio(total){
    var f=document.getElementById('deckFolio'); var h='';
    for(var i=0;i<total;i++){ h+='<button class="tick" data-i="'+i+'" aria-label="Go to app '+(i+1)+'"></button>'; }
    f.innerHTML=h;
  }
  function buildTags(){
    var set={}; ALL.forEach(function(p){ (p.tags||[]).forEach(function(t){ set[t]=1; }); });
    var order=['all','llm','agents','graph','vision','software','spatio-temporal','industry','academia','fun'].filter(function(t){ return t==='all'||set[t]; });
    document.getElementById('deckTags').innerHTML=order.map(function(t){ return '<button class="filter-tag'+(t==='all'?' active':'')+'" data-tag="'+t+'">'+(t==='all'?'All':t)+'</button>'; }).join('');
  }

  buildTags(); buildSlides();

  var swiper=new Swiper('#deck', {
    speed:720, parallax:true, grabCursor:true,
    keyboard:{ enabled:true }, mousewheel:{ forceToAxis:true, thresholdDelta:24 },
    hashNavigation:{ watchState:true }, a11y:{ enabled:true },
    autoplay:(reduce||isTouch)?false:{ delay:6000, disableOnInteraction:false },
    pagination:{ el:'#deckFolio', clickable:true, bulletClass:'tick', bulletActiveClass:'on',
      renderBullet:function(i,cls){ return '<button class="'+cls+'" data-i="'+i+'" aria-label="Go to app '+(i+1)+'"></button>'; } },
    on:{
      init:function(){ announce(this); setupRotators(); },
      slideChange:function(){ announce(this); },
      slideChangeTransitionStart:function(){ setupRotators(); },
      autoplayTimeLeft:function(s,time,progress){ document.getElementById('deckProg').style.width=((1-progress)*100).toFixed(1)+'%'; },
      autoplayStop:function(){ document.getElementById('deckProg').style.width='0%'; }
    }
  });
  window.__deck=swiper;

  function announce(s){
    s=s||swiper; if(!s) return; var i=s.realIndex||s.activeIndex||0; var p=current[i];
    if(p) document.getElementById('deckLive').textContent='App '+(i+1)+' of '+current.length+': '+(p.titleShort||p.id);
  }

  // ===== in-plate multi-image rotators (auto + dots + click-zoom) =====
  function setupRotators(){
    rotorTimers.forEach(clearInterval); rotorTimers=[];
    document.querySelectorAll('.deck-slide .plate[data-multi]').forEach(function(plate){
      if(plate.__inited) { return; } plate.__inited=true;
      var imgs=[].slice.call(plate.querySelectorAll('.rimg'));
      var dotsWrap=plate.querySelector('.rdots'); var i=0;
      imgs.forEach(function(_,k){ var d=document.createElement('i'); d.addEventListener('click',function(e){ e.stopPropagation(); go(k); }); dotsWrap.appendChild(d); });
      function go(n){ i=(n+imgs.length)%imgs.length; imgs.forEach(function(im,k){ im.classList.toggle('on',k===i); }); [].forEach.call(dotsWrap.children,function(d,k){ d.classList.toggle('on',k===i); }); plate.dataset.cur=i; }
      go(0);
      if(!reduce){ var t=setInterval(function(){ go(i+1); },3800); rotorTimers.push(t);
        plate.addEventListener('mouseenter',function(){ clearInterval(t); });
        plate.addEventListener('mouseleave',function(){ clearInterval(t); t=setInterval(function(){ go(i+1); },3800); rotorTimers.push(t); }); }
    });
  }

  // ===== lightbox (click any plate image) =====
  var lb=document.getElementById('deckLb'), lbImg=document.getElementById('deckLbImg'), lbList=[], lbI=0;
  function lbShow(){ lbImg.src=lbList[lbI]; var multi=lbList.length>1; document.getElementById('deckLbPrev').style.display=multi?'':'none'; document.getElementById('deckLbNext').style.display=multi?'':'none'; }
  function lbOpen(plate){ var im=[].slice.call(plate.querySelectorAll('.rimg')).map(function(x){ return x.getAttribute('src'); }); lbList=im; lbI=parseInt(plate.dataset.cur||'0',10)||0; lbShow(); lb.classList.add('on'); if(swiper.autoplay&&swiper.autoplay.running){ swiper.autoplay.stop(); autoIcon(); } }
  function lbClose(){ lb.classList.remove('on'); lbImg.src=''; }
  function lbGo(n){ if(!lbList.length) return; lbI=(n+lbList.length)%lbList.length; lbShow(); }
  document.getElementById('deckWrap').addEventListener('click', function(e){ var st=e.target.closest('.rstack'); if(st) lbOpen(st.closest('.plate')); });
  document.getElementById('deckWrap').addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('rstack')){ e.preventDefault(); lbOpen(e.target.closest('.plate')); } });
  document.getElementById('deckLbX').addEventListener('click', lbClose);
  document.getElementById('deckLbPrev').addEventListener('click', function(e){ e.stopPropagation(); lbGo(lbI-1); });
  document.getElementById('deckLbNext').addEventListener('click', function(e){ e.stopPropagation(); lbGo(lbI+1); });
  lb.addEventListener('click', function(e){ if(e.target===lb) lbClose(); });
  document.addEventListener('keydown', function(e){  // capture: beat Swiper keyboard while the lightbox is open
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape'){ lbClose(); }
    else if(e.key==='ArrowLeft'){ e.stopImmediatePropagation(); lbGo(lbI-1); }
    else if(e.key==='ArrowRight'){ e.stopImmediatePropagation(); lbGo(lbI+1); }
  }, true);

  // ===== navigation: big arrows =====
  document.getElementById('arrowPrev').addEventListener('click', function(){ swiper.slidePrev(); });
  document.getElementById('arrowNext').addEventListener('click', function(){ swiper.slideNext(); });

  // ===== controls: tags / search / sort =====
  function refresh(){ buildSlides(); swiper.update(); swiper.slideTo(0,0);
    if(swiper.pagination){ swiper.pagination.render(); swiper.pagination.update(); }
    setupRotators(); announce(swiper); if(!(reduce||isTouch)&&swiper.autoplay) swiper.autoplay.start(); }
  document.getElementById('deckTags').addEventListener('click', function(e){ var b=e.target.closest('[data-tag]'); if(!b) return;
    [].forEach.call(this.querySelectorAll('.filter-tag'),function(x){ x.classList.toggle('active',x===b); }); state.tag=b.dataset.tag; refresh(); });
  document.getElementById('deckSearch').addEventListener('input', function(){ state.q=(this.value||'').trim().toLowerCase(); refresh(); });
  document.getElementById('deckSort').addEventListener('change', function(){ state.sort=this.value; refresh(); });

  // ===== autoplay toggle + fullscreen =====
  var autoBtn=document.getElementById('btnAuto');
  function autoIcon(){ autoBtn.innerHTML='<i class="fas fa-'+((swiper.autoplay&&swiper.autoplay.running)?'pause':'play')+'"></i>'; }
  autoBtn.addEventListener('click', function(){ if(!swiper.autoplay) return; if(swiper.autoplay.running){ swiper.autoplay.stop(); } else { swiper.autoplay.start(); } autoIcon(); });
  if(reduce||isTouch){ autoBtn.innerHTML='<i class="fas fa-play"></i>'; }
  document.getElementById('btnFull').addEventListener('click', function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el).then(function(){ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }).catch(function(){}); }
    else { document.exitFullscreen(); }
  });

  // ===== reveal controls on mouse-move; keyboard shortcuts =====
  var idleT;
  function showControls(){ document.body.classList.add('controls-on'); clearTimeout(idleT); idleT=setTimeout(function(){ document.body.classList.remove('controls-on'); },2600); }
  window.addEventListener('mousemove', showControls);
  window.addEventListener('keydown', function(e){
    showControls();
    if(e.key==='/'){ e.preventDefault(); document.getElementById('deckSearch').focus(); }
    else if(e.key==='f'||e.key==='F'){ document.getElementById('btnFull').click(); }
    else if(e.key===' '&&e.target===document.body){ e.preventDefault(); autoBtn.click(); }
  });
  document.getElementById('ribbon').addEventListener('mouseenter', function(){ clearTimeout(idleT); });

  // ===== first-load teaching hint (every open) =====
  document.body.classList.add('intro');
  setTimeout(function(){ document.body.classList.remove('intro'); }, 4800);

  // ===== mobile: custom swipe for the rotated deck =====
  var rotor=document.querySelector('.deck-rotor');
  var mqRot=window.matchMedia('(orientation: portrait) and (max-width: 820px)');
  function applyRotMode(){
    var on=mqRot.matches; swiper.allowTouchMove=!on;  // Swiper's own touch only when NOT rotated
  }
  applyRotMode(); (mqRot.addEventListener?mqRot.addEventListener('change',applyRotMode):mqRot.addListener(applyRotMode));
  var tsx=null, tsy=null;
  rotor.addEventListener('touchstart', function(e){ if(!mqRot.matches||!e.touches[0]) return; tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; }, {passive:true});
  rotor.addEventListener('touchend', function(e){ if(!mqRot.matches||tsy==null) return; var t=e.changedTouches[0]; if(!t) return;
    var dx=t.clientX-tsx, dy=t.clientY-tsy; tsx=tsy=null;
    if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>40){ if(dy<0) swiper.slideNext(); else swiper.slidePrev(); } }, {passive:true});

  document.getElementById('deckHint').addEventListener('click', function(){ this.classList.add('dismissed'); });
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ document.getElementById('deckHint').classList.toggle('dismissed', !mqRot.matches); applyRotMode(); }, 300); });
})();
</script>
</body>
</html>
