name: backup-analytics

on:
  schedule:
    # 04:17 UTC every Sunday. Off-peak for Clarity API; 4th cron slot of the hour
    # to spread load vs other users on :00/:15/:30/:45.
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Clarity snapshot
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: python3 scripts/fetch_clarity.py

      - name: Commit snapshot (if any)
        run: |
          if [ -z "$(git status --porcelain data/analytics)" ]; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics
          git commit -m "chore: weekly clarity analytics snapshot"
          # Retry push with rebase if origin moved while we were running
          for attempt in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — pulling --rebase and retrying"
            git pull --rebase origin master
          done
          echo "push still failing after 3 attempts" >&2
          exit 1
