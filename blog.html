<!DOCTYPE html>
<html lang="en" data-site="blog">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://c.clarity.ms;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://*.clarity.ms;
        frame-src 'self';
        worker-src 'self' blob:;
        base-uri 'self';
        object-src 'self';
        upgrade-insecure-requests
    ">
    <title>Blog — Linlin Jia, Ph.D.</title>
    <meta name="description" content="Notes on machine learning, tooling, and building things — by Linlin Jia. Markdown / LaTeX / Jupyter, four languages, human × AI.">
    <link rel="canonical" href="https://jajupmochi.github.io/blog.html">
    <link rel="alternate" type="application/rss+xml" title="Linlin Jia — Blog" href="feed.xml">

    <!-- Fonts (match homepage) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&family=Indie+Flower&family=Patrick+Hand&family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=JetBrains+Mono:wght@400;600;700&display=swap">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon (LJ monogram, matches homepage) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231e3a8a' width='32' height='32' rx='7'/%3E%3Ctext x='50%25' y='74%25' text-anchor='middle' fill='white' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-size='22' font-weight='900'%3E%E6%9E%97%3C/text%3E%3C/svg%3E">

    <!-- Syntax highlighting (highlight.js) + KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- Site styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/parchment-overrides.css">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body data-theme="academic" class="blog-body">

    <!-- ===== Navbar (lean, parchment) ===== -->
    <nav class="blog-navbar">
        <div class="blog-navbar-inner">
            <a href="index_en.html" class="blog-brand" aria-label="Back to homepage">
                <span class="blog-brand-mark">林</span>
                <span class="blog-brand-text">Linlin Jia</span>
            </a>
            <div class="blog-nav-right">
                <a href="index_en.html" class="blog-nav-home" data-i18n="blog.nav_home">← Home</a>
                <!-- Reading size: Standard / Comfort (post view only; shown by blog.js) -->
                <div class="blog-reading" id="blogReading" role="group" aria-label="Reading size" hidden>
                    <button type="button" data-fs="standard" class="active" aria-label="Standard text size">A</button>
                    <button type="button" data-fs="comfort" aria-label="Comfortable text size">A</button>
                </div>
                <div class="blog-lang-switch" role="group" aria-label="Language">
                    <button data-lang="en" class="active">EN</button>
                    <button data-lang="zh">中文</button>
                    <button data-lang="fr">FR</button>
                    <button data-lang="de">DE</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Reading-progress ink trail (fills as you scroll a post) -->
    <div class="blog-progress" id="blogProgress" aria-hidden="true"><i></i></div>

    <!-- Floating, collapsible table of contents (post view only; built by blog.js) -->
    <aside class="blog-toc" id="blogToc" hidden>
        <button class="blog-toc-toggle" id="blogTocToggle" type="button" aria-expanded="true">
            <span class="blog-toc-title" data-i18n="blog.contents">Contents</span>
            <span class="blog-toc-chevron" aria-hidden="true">▾</span>
        </button>
        <nav class="blog-toc-nav" id="blogTocNav"></nav>
    </aside>

    <main class="blog-main">

        <!-- ===== Blog index (post list) ===== -->
        <section id="blogIndex" class="blog-index">
            <header class="blog-index-head">
                <h1 class="blog-index-title section-title" data-i18n="blog.title">Blog</h1>
                <p class="blog-index-tagline" data-i18n="blog.tagline">Notes on ML, tooling, and building things — written human × AI, in four languages.</p>
            </header>
            <!-- Controls: search · sort · view-mode (gallery / list / compact) -->
            <div class="blog-controls" id="blogControls" hidden>
                <div class="blog-search">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input type="search" id="blogSearch" autocomplete="off"
                           data-i18n-ph="blog.search" placeholder="Search posts…">
                </div>
                <select class="blog-sort" id="blogSort" aria-label="Sort posts"></select>
                <div class="blog-viewmodes" id="blogViewModes" role="group" aria-label="View mode">
                    <button type="button" data-view="gallery" title="Gallery"><i class="fas fa-table-cells-large" aria-hidden="true"></i></button>
                    <button type="button" data-view="list" class="active" title="List"><i class="fas fa-list" aria-hidden="true"></i></button>
                    <button type="button" data-view="compact" title="Compact"><i class="fas fa-bars" aria-hidden="true"></i></button>
                </div>
            </div>
            <!-- Tag / category filter chips -->
            <div class="blog-tagfilter" id="blogTagFilter" hidden></div>

            <div id="blogPostList" class="blog-post-list" data-view="list">
                <!-- post cards injected by js/blog.js -->
                <p class="blog-loading" data-i18n="blog.loading">Loading posts…</p>
            </div>
        </section>

        <!-- ===== Single post view ===== -->
        <article id="blogPost" class="blog-post" hidden>
            <a href="blog.html" class="blog-back" data-i18n="blog.back">← All posts</a>
            <div class="blog-post-meta" id="blogPostMeta"><!-- meta chips injected --></div>
            <div class="blog-post-langbar" id="blogPostLangbar"><!-- per-post lang availability --></div>
            <div class="blog-post-body markdown-body" id="blogPostBody"><!-- rendered markdown --></div>
            <div class="blog-post-foot" id="blogPostFoot"></div>
        </article>

    </main>

    <footer class="blog-footer">
        <p>© <span id="blogYear"></span> Linlin Jia ·
           <a href="index_en.html" data-i18n="blog.nav_home">← Home</a> ·
           <a href="https://github.com/jajupmochi" target="_blank" rel="noopener">GitHub</a> ·
           <a href="feed.xml" target="_blank" rel="noopener" title="RSS feed"><i class="fas fa-rss" aria-hidden="true"></i> RSS</a>
        </p>
        <p class="blog-footer-note" data-i18n="blog.foot_note">Built as a static, client-rendered blog — Markdown · LaTeX · Jupyter · Mermaid.</p>
    </footer>

    <!-- ===== Render libs (deferred) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
